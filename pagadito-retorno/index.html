<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación de Pago - CachadasSV</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background-color: #1e293b;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    h2 {
      font-size: 22px;
      margin: 0 0 12px;
    }
    .success {
      color: #4ade80;
    }
    .error {
      color: #ef4444;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin: 8px 0;
      word-break: break-all;
    }
    .details {
      background-color: #0f172a;
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
      text-align: left;
      border: 1px solid #334155;
    }
    .details p {
      color: #f8fafc;
      font-size: 13px;
      margin: 6px 0;
    }
    .label {
      color: #38bdf8;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="content" class="card">
    <h2 id="titulo">Procesando...</h2>
    <p id="mensaje">Verificando los datos del retorno.</p>
  </div>

  <script>
    function procesarRetorno() {
      const params = new URLSearchParams(window.location.search);
      
      // 1. Leer "token" o "value"
      const token = params.get("token") || params.get("value") || "";
      
      // 2. Leer "ern" o "ern_value"
      const ern = params.get("ern") || params.get("ern_value") || "";

      const contentDiv = document.getElementById("content");

      // 3. Mostrar en pantalla "Pago recibido" y los valores recibidos
      if (token) {
        contentDiv.innerHTML = `
          <h2 class="success">¡Pago Recibido!</h2>
          <p>Tu transacción ha sido retornada con éxito.</p>
          <div class="details">
            <p><span class="label">Token:</span> ${token}</p>
            <p><span class="label">ERN:</span> ${ern || 'No especificado'}</p>
          </div>
        `;
      } else {
        contentDiv.innerHTML = `
          <h2 class="error">Sin Datos de Pago</h2>
          <p>No se encontraron parámetros de verificación en la URL.</p>
        `;
      }
    }

    procesarRetorno();
  </script>
</body>
</html>
